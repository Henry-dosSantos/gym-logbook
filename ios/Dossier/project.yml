# XcodeGen spec for the Dossier iOS app. On the Mac:
#   brew install xcodegen
#   cd ios/Dossier && xcodegen generate && open Dossier.xcodeproj
# Dossier.xcodeproj is generated: do not commit it or edit it by hand; change this file instead.
name: Dossier
options:
  bundleIdPrefix: com.henrydossantos # placeholder: use a reverse domain you own before the first upload
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  DossierCore:
    path: ../DossierCore
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "" # set to the Apple Developer Program team ID
targets:
  Dossier:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: DossierCore
        product: DossierCore
      - package: DossierCore
        product: DossierStore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.henrydossantos.dossier # placeholder, see bundleIdPrefix
        PRODUCT_NAME: Dossier
        TARGETED_DEVICE_FAMILY: "1" # iPhone only
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Dossier
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Dossier:
    build:
      targets:
        Dossier: all
